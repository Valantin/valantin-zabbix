---
version: 5

defaults:
  datadir: data
  data_hash: yaml_data

hierarchy:
  - name: "osfamily/major release"
    path: "os/%{facts.os.family}/%{facts.os.release.major}.yaml"
  - name: "osfamily/name"
    path: "os/%{facts.os.family}/%{facts.os.name}.yaml"
  - name: "osfamily"
    path: "os/%{facts.os.family}.yaml"
  - name: Common
    path: common.yaml
